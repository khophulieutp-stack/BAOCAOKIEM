<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đang chuyển hướng...</title>
    <script>
        // Đọc dữ liệu từ localStorage
        const dataStr = localStorage.getItem('viewReportData');
        if (dataStr) {
            const report = JSON.parse(dataStr);
            const hasUncountable = report.items.some(item => {
                const unit = (item.donVi || '').toLowerCase().trim();
                return unit === 'm' || unit === 'yard' || unit === 'mét';
            });
            // Chuyển hướng đến đúng file mẫu thực tế
            if (hasUncountable) {
                window.location.replace('report_uncountable.html');
            } else {
                window.location.replace('final_report.html');
            }
        } else {
            alert('Không tìm thấy dữ liệu báo cáo!');
            window.close();
        }
    </script>
</head>
<body>
    <p style="text-align:center; margin-top: 50px; font-family: Arial;">Đang tải biên bản kiểm tra...</p>
</body>
</html>
